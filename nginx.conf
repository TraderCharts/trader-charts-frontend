server {
    listen 80;

    root /usr/share/nginx/html;   # React build output
    index index.html;              # Default file

    # SPA fallback: let React Router handle routes
    location / {
        try_files $uri /index.html;
    }

    # Serve static assets
    location /static/ {}

    # Optional: redirect 404s to React
    error_page 404 /index.html;
}
